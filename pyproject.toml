[project]
name = "fastapi-testing"
version = "0.3.3"
description = "A lightweight, async-first testing framework for FastAPI applications"
authors = [
    { name = "Ove Ranheim", email = "oranheim@gmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["fastapi", "testing", "async", "pytest", "integration-testing", "test-framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.165.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "httpx[http2]>=0.28.1",
    "websockets>=17.4",
    "typing-extensions>=4.16.0 ; python_full_version < '3.12'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pydantic>=2.14.4",
    "ruff>=0.17.6",
    "restructuredtext-lint>=2.0.2",
    "pygments>=2.21.0",
    "ty>=0.0.109",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_testing"]

[tool.hatch.build]
exclude = [
    "docs/*",
    "examples/*",
    "tests/*",
    ".github/*",
    "*.gif",
    "*.png",
    "dist/*",
    "build/*",
    ".pytest_cache",
    "__pycache__",
    "*.pyc"
]

[project.urls]
Homepage = "https://github.com/descoped/fastapi-testing"
Repository = "https://github.com/descoped/fastapi-testing"
Issues = "https://github.com/descoped/fastapi-testing/issues"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
# Used by the pyright language server (editors) and the `pyright` CLI. uv creates the
# project environment as `.venv` next to this file; pyright does not find it on its own.
venvPath = "."
venv = ".venv"
# Same scope as the CI gate; ty checks the tests too ([tool.ty] below).
include = ["src", "tests/typing"]
# Check against the lowest supported Python so newer-only syntax is caught.
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ty]
# Astral's type checker: `uv run ty check` (a dev dependency, so the version is locked and
# Renovate tracks it). Defaults that already fit and are therefore not set here:
# - Python version: the minimum of project.requires-python (3.11).
# - Environment: VIRTUAL_ENV under `uv run`, else `.venv` next to this file.
# - First-party code: `src/` is found automatically.
# - Any diagnostic, warnings included, fails the run (terminal.error-on-warning = true).
#
# This is a published library with a typed API (py.typed), so it is checked strictly.
# Suppress a single line with `# ty: ignore[<rule>]` and a comment saying why; never a bare
# `ty: ignore`.

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# Only `ty: ignore` silences ty; `type: ignore[...]` comments must not hide ty diagnostics.
respect-type-ignore-comments = false
# Infer return types of unannotated functions (fixtures, test helpers) instead of treating
# them as Unknown, so their callers are checked too.
return-type-inference = "always"

[tool.ty.rules]
# Opt-in rules that hold for this code base. tests/typing marks errors that MUST occur with
# ty: ignore comments, so an unused one fails.
unused-ignore-comment = "error"
possibly-unresolved-reference = "error"
unsound-return = "error"
# Not redundant-condition-strict: it reports `graceful` in AsyncTestServer.stop()'s `finally`
# as always true, but a cancelled stop() reaches that block with it still False.

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
respect-gitignore = true
extend-exclude = [
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    ".venv",
    ".env",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E741",   # Ambiguous variable name
    "B008",   # Do not perform function calls in argument defaults
    "B017",   # Assert raises on Exception - sometimes needed for testing
    "T201",   # Print found (allow print statements)
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_testing"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
