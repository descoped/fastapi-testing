name: Build and Test

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
    paths-ignore:
      - '**.md'
  # Every PR, including stacked PRs whose base is another PR's branch.
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  UV_VERSION: '0.13.9'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ env.UV_VERSION }}
    
    - name: Install dependencies
      run: |
        uv sync --all-groups
    
    - name: Run tests with coverage
      env:
        FASTAPI_TESTING_PORT_RANGE_START: 8001
        FASTAPI_TESTING_PORT_RANGE_END: 9000
      run: |
        uv run pytest -v --tb=short --cov=src/fastapi_testing --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == env.PYTHON_VERSION
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: descoped/fastapi-testing

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ env.UV_VERSION }}
    
    - name: Build package
      run: |
        uv build